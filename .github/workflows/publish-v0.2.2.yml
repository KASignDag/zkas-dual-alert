name: publish-v0.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.2.2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build release archive
        run: |
          zip -r zkas-dual-alert-v0.2.2.zip . \
            -x ".git/*" "data/*" "dist/*" "__pycache__/*" "*.pyc" "*.zip" "*.sha256" "config.json" "web_config.json" "state.json" "alert.log" "*.log" "*.pid" "*.db" "*.sqlite*" ".env*" "wallet-token.txt" ".github/workflows/publish-v0.2.2.yml"
          sha256sum zkas-dual-alert-v0.2.2.zip > zkas-dual-alert-v0.2.2.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2 >/dev/null 2>&1; then
            echo "Release v0.2.2 already exists."
          else
            gh release create v0.2.2 \
              zkas-dual-alert-v0.2.2.zip \
              zkas-dual-alert-v0.2.2.zip.sha256 \
              --target "${GITHUB_SHA}" \
              --title "ZKas Dual Alert v0.2.2 — Unofficial Community Tool" \
              --notes-file RELEASE_NOTES_v0.2.2.md
          fi
